<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random user Generator</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <div class="head-content">
            <div>
              <h1>Random User Generator</h1>
              <p>Discover a random user with one click!</p>
            </div>
          <button id="themedbtn" class="toggleBtn" type="button">🌙 Dark Mode</button>
        </div>
    </header>
    <main>
        <section class="controls">
            <h2>Generate Users</h2>
            <div class="filter-controls">
                <div>
                    <label for="userCount">Number of users</label>
                    <select id="userCount">
                        <option value="1">1 User</option>
                        <option value="5" selected>5 Users</option>
                        <option value="10">10 Users</option>
                    </select>
                </div>

                <div>
                    <label for="genderFilter">Gender</label>
                    <select id="genderFilter">
                        <option value="">Any Gender</option>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                    </select>
                </div>

                  <div>
                    <label for="nationalityFilter">Nationality</label>
                    <select id="nationalityFilter">
                        <option value="">Any Nationality</option>
                        <option value="AU">Australia</option>
                        <option value="BR">Brazil</option>
                        <option value="CA">Canada</option>
                        <option value="DE">Germany</option>
                        <option value="FR">France</option>
                        <option value="GB">United Kingdom</option>
                        <option value="IN">India</option>
                        <option value="JP">Japan</option>
                        <option value="NP">Nepal</option>
                        <option value="US">United States</option>
                    </select>
                </div>
            </div>
             <button id="generatorBtn" type="button">Generate Random Users</button>
              <p id="myMessage" role="status">Choose your filters and generate users.</p>
        </section>

        <section id="myInfo">
            <h2>Generate Profiles</h2>
            <div id="userCard" class="user-grid">
            </div>
        </section>

        <section class="myFavourite">
            <h2>❤️ My Favorite Users</h2>
            <p id="myFavId">Your favourite profiles will appear here.</p>
            <div id="favList" class="user-grid"></div>
        </section>
    </main>
</body>
</html>
